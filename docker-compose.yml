services:
  postgres:
    image: postgres:16
    container_name: money-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: money
    ports:
      - "5432:5432"
    volumes:
      - money_postgres_data:/var/lib/postgresql/data

volumes:
  money_postgres_data:
